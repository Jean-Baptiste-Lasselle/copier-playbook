---
- name: Ensure sshd_config.d directory exists
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Manage SSH password authentication policy
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-ansible-auth.conf
    content: |
      PasswordAuthentication {{ 'no' if podman_harden_ssh else 'yes' }}
    owner: root
    group: root
    mode: "0600"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Restart sshd

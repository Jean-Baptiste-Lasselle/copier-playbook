_min_copier_version: "9.0.0"
_subdirectory: template
_templates_suffix: .jinja

project_name:
  type: str
  help: Name of the Ansible playbook repository (e.g., infra-web-servers)
  validator: "{% if not project_name %}Project name cannot be empty{% endif %}"

description:
  type: str
  default: Ansible playbooks for Linux server provisioning and configuration
  help: Short project description

remote_user:
  type: str
  default: ansible
  help: Default SSH user on target Linux servers

dev_web_ip:
  type: str
  default: 192.168.10.11
  help: Static IP address for the initial dev web server

dev_db_ip:
  type: str
  default: 192.168.10.12
  help: Static IP address for the initial dev database server

container_driver:
  type: str
  default: podman
  choices:
    - podman
    - docker
  help: Container runtime used by Molecule for local Linux testing

_tasks:
  - command: git init
    when: "{{ not _copier_conf.answers_file is exists }}"
  - command: pre-commit install || true
